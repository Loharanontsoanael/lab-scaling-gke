# Appliqué après l'installation de kube-prometheus-stack (CRD ServiceMonitor)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: webapp
  namespace: lab
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: webapp }
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
