# VPA en mode "Off" : il n'agit pas, il RECOMMANDE seulement des requests.
# Compatible avec le HPA (bonne pratique GKE : observer avant d'automatiser).
#   kubectl -n lab describe vpa webapp-recommender
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: webapp-recommender
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp
  updatePolicy:
    updateMode: "Off"
