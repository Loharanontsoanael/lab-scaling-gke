# SCALING VERTICAL : le VPA ajuste CPU/RAM de chaque pod.
# InPlaceOrRecreate (GKE ≥ 1.34) : redimensionne à chaud si possible, sinon recrée le pod.
# Pas de HPA dans cet overlay (les deux se contrediraient sur CPU/RAM).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: webapp
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
    minReplicas: 2
  resourcePolicy:
    containerPolicies:
      - containerName: app
        minAllowed: { cpu: 100m, memory: 96Mi }
        maxAllowed: { cpu: "2", memory: 1Gi }
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits
