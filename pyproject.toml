[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]

[tool.ruff.lint.per-file-ignores]
"monitoring/make_dashboard.py" = ["E501"]   # requêtes PromQL : plus lisibles sur une ligne
