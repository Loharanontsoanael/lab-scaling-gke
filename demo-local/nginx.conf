# Load balancer du plan B.
# Le DNS interne de Docker (127.0.0.11) renvoie l'IP de TOUTES les répliques de « app » ;
# le nom est re-résolu toutes les 2 s, donc les répliques ajoutées par --scale sont prises en compte.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;

    location / {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        # Si une réplique est en panne, nginx réessaie sur une autre (haute dispo)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
